<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Contacts</title>
    <link rel="stylesheet" href="contacts.css">
    <script src="contacts.js" defer></script>
</head>

<body>
    <div class="container">
        <header class="page-header">
            <h1>My Contacts</h1>
            <p class="subtitle">Manage the people you know</p>
        </header>

        <button id="showFormBtn" class="btn btn-primary">+ Add Contact</button>

        <form id="contactForm" class="contact-form hidden">
            <h2 id="formTitle">Add Contact</h2>
            <input type="hidden" id="contactId">
            <input type="text" id="firstName" placeholder="First name" required>
            <input type="text" id="lastName" placeholder="Last name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="text" id="favoriteColor" placeholder="Favorite color" required>
            <input type="date" id="birthday" required>
            <div class="form-actions">
                <button type="submit" id="submitBtn" class="btn btn-primary">Save Contact</button>
                <button type="button" id="cancelBtn" class="btn btn-ghost">Cancel</button>
            </div>
        </form>

        <div class="toolbar">
            <input type="search" id="searchInput" class="search-input" placeholder="Search contacts…" aria-label="Search contacts">
        </div>

        <section id="contactsGrid" class="contacts-grid" aria-live="polite">
        </section>

        <p id="status" class="status"></p>
    </div>
</body>

</html>
